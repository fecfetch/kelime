name: word_game_practice_languages
description: A word puzzle game to practice languages.

publish_to: 'none'

version: 1.0.10+11

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  json_annotation: ^4.9.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  audioplayers: ^6.5.0
  google_mobile_ads: ^5.1.0
  flutter_tts: ^4.2.3
  flutter_local_notifications: ^17.2.1
  workmanager: ^0.9.0+3
  path_provider: ^2.1.5
  in_app_review: ^2.0.9
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/levels/
    - assets/Music/

flutter_launcher_icons:
 android: "launcher_icon"
 ios: false
 image_path: "Word Game- Learn Languages Logo.png"